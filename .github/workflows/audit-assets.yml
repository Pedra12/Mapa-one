name: Audit and extract all game assets

on:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - 'tools/audit_assets.py'
      - 'tools/inspect_nested_zips.py'
      - 'tools/extract_rar_assets.py'
      - '.github/workflows/audit-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unar

      - name: Download the nature asset pack from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download V1.0.0 --repo Pedra12/Mapa-one \
            --pattern "Stylized.Nature.MegaKit.Standard.zip" \
            --dir release-assets

      - name: Extract and inventory every ZIP
        run: |
          python3 tools/audit_assets.py \
            --source . \
            --release-zip "release-assets/Stylized.Nature.MegaKit.Standard.zip" \
            --output asset-audit

      - name: Extract and inspect ZIPs nested inside asset packs
        run: python3 tools/inspect_nested_zips.py

      - name: Extract RAR model archive
        run: python3 tools/extract_rar_assets.py

      - name: Upload complete extracted asset library and inventory
        uses: actions/upload-artifact@v4
        with:
          name: Mapa-one-ALL-assets-extracted-and-inventory
          path: asset-audit/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish readable inventory to repository
        run: |
          mkdir -p reports/asset-audit
          cp asset-audit/ASSET_INVENTORY.md reports/asset-audit/
          cp asset-audit/asset_inventory.json reports/asset-audit/
          cp asset-audit/NESTED_ASSETS.md reports/asset-audit/
          cp asset-audit/nested_inventory.json reports/asset-audit/
          cp asset-audit/RAR_ASSETS.md reports/asset-audit/
          cp asset-audit/rar_inventory.json reports/asset-audit/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/asset-audit/
          if ! git diff --cached --quiet; then
            git commit -m "Publish complete extracted map asset inventory"
            git push
          fi
