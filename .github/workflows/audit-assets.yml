name: Audit and extract all game assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download the nature asset pack from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download V1.0.0 --repo Pedra12/Mapa-one \
            --pattern "Stylized.Nature.MegaKit.Standard.zip" \
            --dir release-assets

      - name: Extract and inventory every ZIP
        run: |
          python3 tools/audit_assets.py \
            --source . \
            --release-zip "release-assets/Stylized.Nature.MegaKit.Standard.zip" \
            --output asset-audit

      - name: Upload complete extracted asset library and inventory
        uses: actions/upload-artifact@v4
        with:
          name: Mapa-one-ALL-assets-extracted-and-inventory
          path: asset-audit/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
